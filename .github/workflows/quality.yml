name: Flutter Quality

on:
  push:
    branches:
      - main
      - agent/project-foundation
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    if: github.repository_owner == 'phakphoum38-stack'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout owner branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download and set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify Flutter SDK
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Auto format Dart files
        run: dart format .

      - name: Commit formatting changes
        if: github.ref_name != 'main'
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.dart'
          git commit -m "style: apply dart format"
          git push origin HEAD:${{ github.ref_name }}

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
