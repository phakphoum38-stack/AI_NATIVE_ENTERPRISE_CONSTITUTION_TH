name: Docs Quality

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs-quality.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint and links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect Markdown files
        id: markdown
        shell: bash
        run: |
          if find . -type f -name '*.md' -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint Markdown
        if: steps.markdown.outputs.found == 'true'
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Check Markdown links
        if: steps.markdown.outputs.found == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            "./**/*.md"
          fail: true

      - name: No Markdown files yet
        if: steps.markdown.outputs.found != 'true'
        run: echo "No Markdown files found; nothing to validate."
