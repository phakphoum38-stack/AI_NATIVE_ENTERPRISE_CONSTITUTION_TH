name: AI Workspaces Model CI

on:
  pull_request:
    paths:
      - "ai-workspaces-model/**"
      - ".github/workflows/ai-workspaces-model-ci.yml"
  push:
    branches: [main]
    paths:
      - "ai-workspaces-model/**"
      - ".github/workflows/ai-workspaces-model-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-workspaces-model/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-workspaces-model/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ai-workspaces-model
          push: false
          tags: ai-workspaces-model:ci
