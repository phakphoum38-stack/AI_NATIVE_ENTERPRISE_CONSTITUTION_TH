name: AI Workspaces Model CI

on:
  pull_request:
    paths:
      - "ai-workspaces-model/**"
      - ".github/workflows/ai-workspaces-model-ci.yml"
  push:
    branches: [main]
    paths:
      - "ai-workspaces-model/**"
      - ".github/workflows/ai-workspaces-model-ci.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-workspaces-model/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
